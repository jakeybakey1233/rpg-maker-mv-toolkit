name: Static checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, demo data, install logic, and packaging
        run: python -m unittest discover -s tests -v
      - name: Smoke-test isolated save-state plugin commands
        run: node tests/intox_smoke.js
